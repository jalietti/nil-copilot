name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Includes the database-level RLS/grants/invite tests (PGlite: the real
      # Postgres engine in-process, all migrations applied).
      - run: npm run test
      - run: npm run build

  integration:
    name: RLS isolation + end-to-end (real Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Only the services the tests use: Postgres (with every migration
      # applied), Auth, PostgREST behind Kong, and Mailpit (the e2e signup
      # reads the confirmation email from it).
      - run: >-
          npx -y supabase@2 start -x
          studio,storage-api,realtime,imgproxy,edge-runtime,logflare,vector,postgres-meta,supavisor
      - run: npm run test:rls
      # Browser tests of the core flow against a production build, the local
      # stack (reset to supabase/seed.sql), and a mock Anthropic API.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
