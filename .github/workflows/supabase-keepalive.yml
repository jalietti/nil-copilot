name: Supabase keep-alive

# Free-plan Supabase projects pause after a week without enough user database
# activity ("a few user requests each day"). A successful daily query keeps
# dev and prod awake. keepalive() is migration 0016: it reads no tables.
# Uses only the public anon/publishable keys (the same ones the browser ships).

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: dev
            url_secret: SUPABASE_DEV_URL
            key_secret: SUPABASE_DEV_ANON_KEY
          - project: prod
            url_secret: SUPABASE_PROD_URL
            key_secret: SUPABASE_PROD_ANON_KEY
    steps:
      - name: Query PostgREST
        env:
          SUPABASE_URL: ${{ secrets[matrix.url_secret] }}
          SUPABASE_KEY: ${{ secrets[matrix.key_secret] }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Missing ${{ matrix.url_secret }} or ${{ matrix.key_secret }} repo secret"
            exit 1
          fi
          # Must be a successful query: a permission error may not count as
          # activity. curl's own failure (DNS, timeout) is reported as 000.
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" -d '{}') || status=000
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase ${{ matrix.project }} keep-alive failed (HTTP $status). 000/540 = paused or unreachable; 404 = migration 0016 not applied"
            exit 1
          fi
